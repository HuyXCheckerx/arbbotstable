[package]
name = "evm-quoter"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
parking_lot = "0.12.5"
rayon = "1.12.0"
revm = { version = "36.0.0", default-features = false, features = ["std", "serde", "portable", "optional_balance_check", "optional_no_base_fee", "optional_eip3607", "optional_block_gas_limit", "optional_fee_charge"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
